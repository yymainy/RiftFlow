legal:
  declaration:
    title: Terms of Use
    isFree: is free
    ok: I have read and agree to the terms and understand this software {isFree}
    quit: Quit
    newContent: |
      <div class="riftflow-disclaimer">

      <style>
      .riftflow-disclaimer{
        background-color:#ffffff;
        color:#333333;
        line-height:1.65;
        padding:1.75rem 2rem;
        box-shadow:0 2px 6px rgba(0,0,0,.15);
      }
      .riftflow-disclaimer h1,
      .riftflow-disclaimer h2{
        color:#d97706;
        margin-top:1.5rem;
        margin-bottom:.75rem;
        line-height:1.25;
      }
      .riftflow-disclaimer h1{font-size:1.6rem;}
      .riftflow-disclaimer h2{font-size:1.25rem;}
      .riftflow-disclaimer ul{margin-left:1.5rem;}
      .riftflow-disclaimer li{margin-bottom:.65rem;}
      .riftflow-disclaimer a{color:#2563eb;text-decoration:none;}
      .riftflow-disclaimer a:hover{text-decoration:underline;}
      [data-theme='dark'] .riftflow-disclaimer{
        background-color:#1e1e1e;
        color:#e6e6e6;
        box-shadow:0 2px 6px rgba(0,0,0,.35);
      }
      [data-theme='dark'] .riftflow-disclaimer h1,
      [data-theme='dark'] .riftflow-disclaimer h2{
        color:#ffd866;
      }
      [data-theme='dark'] .riftflow-disclaimer a{
        color:#8ab4f8;
      }
      </style>

      # $t(common:appName) Terms of Use

      Please read this page before continuing. Clicking the agreement button confirms that you have read and agree to these terms. Choose Quit if you do not accept them.

      ## About the software
      - RiftFlow is a free League of Legends desktop companion for match analysis, client automation, local match archives, skin inventory and patch summaries.
      - It is independently maintained and is not affiliated with or endorsed by Riot Games or Tencent.
      - Use and distribution are governed by the bundled LICENSE. See THIRD_PARTY_NOTICES.md and LICENSES for third-party terms.

      ## Client connection and automation
      - Connected features require a locally running, signed-in game client. Available interfaces, data and features vary by region and client version; updates may temporarily break features.
      - Enable automatic champion selection, replies and other actions only after reviewing their settings. These features may change client state or send messages to other players.
      - Follow your region's game rules and user agreements. RiftFlow cannot guarantee account safety, continued API availability or successful actions. Disable affected features and exit the app if problems occur.

      ## Data and privacy
      - Match archives, skin snapshots and personal tool data are stored locally. The current independent service supplies notices, contact channels, configuration and release information; it does not provide player archive or skin inventory uploads.
      - Online queries, image loading and patch summaries send network requests to the relevant providers, subject to their service rules.
      - Local logs, screenshots and exported files may contain account or match details. Review and redact them before sharing. Never share tokens, passwords or client credentials.

      ## Results and limitations
      - Synchronization covers only the records currently returned by upstream services. Skin counts reflect the account and client response at synchronization time; temporary access is not permanent ownership.
      - Opponent history analysis offers clues, not proof of boosting, paid companionship, alternate accounts or misconduct. Consult regional patch summaries separately.
      - The software is provided as-is and may contain errors or become unavailable. Back up important archives, exports and settings, and do not rely on its results alone.

      ## Updates and feedback
      - Obtain releases from the project release channel. Exit the old app and back up important data before updating. Automatic update installation is currently unavailable.
      - When reporting a problem, include the app version, server region, reproduction steps and redacted error details.

      </div>
