        color:#e6e6e6;
        box-shadow:0 2px 6px rgba(0,0,0,.35);
      }
      [data-theme='dark'] .riftflow-disclaimer h1,
      [data-theme='dark'] .riftflow-disclaimer h2{
        color:#ffd866;
      }
      [data-theme='dark'] .riftflow-disclaimer a{
        color:#8ab4f8;
      }
      </style>

      # $t(common:appName) 使用须知

      请阅读以下说明，再选择是否继续使用。点击下方同意按钮表示你已阅读并同意本页内容；不接受时可选择退出。

      ## 软件与使用范围
      - RiftFlow 是免费的英雄联盟桌面辅助工具，提供对局分析、客户端自动操作、个人战绩档案、皮肤资产管理和版本简报。
      - 本项目由独立开发者维护，与 Riot Games、腾讯不存在官方隶属或背书关系。
      - 软件使用及分发范围以随附 LICENSE 为准；第三方组件与资源的许可见 THIRD_PARTY_NOTICES.md 和 LICENSES 目录。

      ## 客户端连接与自动操作
      - 相关功能需要连接本机已登录的游戏客户端。国服与国际服的接口、数据范围和功能可用性可能不同，客户端更新也可能导致功能暂时失效。
      - 请按需启用自动选人、自动回复等功能，并在启用前检查配置。这些操作可能改变客户端状态或向其他玩家发送消息。
      - 请遵守所在服区的游戏规则与用户协议。软件无法保证账号安全、接口持续可用或操作始终成功；遇到异常请关闭相关功能并退出软件。

      ## 数据与隐私
      - 个人战绩档案、皮肤快照和个人工具数据保存在本机。当前独立服务提供公告、联系渠道、配置与版本信息，未接入玩家档案或皮肤资产上传。
      - 在线查询、图片加载和版本简报等功能需要向相应数据提供方发起网络请求；这些请求受对方的服务规则约束。
      - 本地日志、截图及导出文件可能含有账号或对局信息。反馈问题前请检查并遮盖敏感内容，不要分享令牌、密码或客户端认证信息。

      ## 结果与使用限制
      - 战绩同步仅覆盖上游当前能返回的记录；皮肤统计以同步时的账号及客户端返回结果为准，限时体验不代表永久拥有。
      - 对手历史分析属于参考线索，不能作为认定代练、陪玩、小号或违规行为的证据。国服与国际服的版本简报请分别参考。
      - 软件按现状提供，可能存在错误或中断。重要档案、导出文件和配置请自行备份，不要将软件结果作为唯一判断依据。

      ## 更新与反馈
      - 请从项目发布渠道获取版本，更新前退出旧程序并备份重要数据；当前版本不提供自动安装更新。
      - 反馈时请提供软件版本、服区、复现步骤和经过脱敏的错误信息。

      </div>
