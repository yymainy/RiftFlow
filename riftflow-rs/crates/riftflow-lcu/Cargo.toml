[package]
name = "riftflow-lcu"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "LCU connection layer: UX discovery, HTTP client, WebSocket subscription, ported from src/main/shards/league-client{,-ux}"

[dependencies]
riftflow-ipc = { workspace = true }
riftflow-radix = { workspace = true }
riftflow-shard = { workspace = true }
riftflow-state = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
# `test-util` enables start_paused, so the 2000 ms reconnect retry is instant.
tokio = { version = "1", features = ["full", "test-util"] }
# used only by examples/live_connect.rs to pull credentials out of the real db
riftflow-store = { workspace = true }
